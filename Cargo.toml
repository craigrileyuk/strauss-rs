[package]
name = "strauss-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
php-rs-parser = "0.21"
php-ast = "0.21"
php-lexer = "0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
fancy-regex = "0.19.2"
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.33"
globset = "0.4.20"
rayon = "1.12.0"
similar = "3.2.0"
indicatif = "0.18.6"
